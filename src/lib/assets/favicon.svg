<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vénus">
	<defs>
		<radialGradient id="glow" cx="50%" cy="38%" r="70%">
			<stop offset="0%" stop-color="#7ce0b0" stop-opacity="0.55" />
			<stop offset="100%" stop-color="#7ce0b0" stop-opacity="0" />
		</radialGradient>
	</defs>
	<rect width="64" height="64" rx="14" fill="#06060c" />
	<circle cx="32" cy="30" r="26" fill="url(#glow)" />
